<style>
:root { --bg:#fbf8f1; --fg:#2d2a26; --muted:#6b645a; --line:#e3dccd; --accent:#c0603a; --card:#ffffff; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#1d1b18; --fg:#ece6da; --muted:#a79f92; --line:#3a362f; --accent:#f0956c; --card:#26231f; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
  font:16px/1.7 -apple-system, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }

h3 { font-size:1.05rem; margin:28px 0 8px; }
p, ul, ol { margin:8px 0; }
a { color:var(--accent); }
code { font-size:.9em; background:var(--card); padding:1px 5px; border-radius:4px; border:1px solid var(--line); }
.table { overflow-x:auto; margin:12px 0; }
table { border-collapse:collapse; width:100%; font-size:.93rem; background:var(--card); }
th, td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top;
  min-width:7.5em; word-break:keep-all; overflow-wrap:anywhere; }
th { color:var(--muted); font-weight:600; }
.lang { font-size:.9rem; margin-bottom:24px; color:var(--muted); }
